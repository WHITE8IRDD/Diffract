<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Diffract — a prism splitting light into a spectrum -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3d4d"/>
      <stop offset="0.5" stop-color="#2a2a36"/>
      <stop offset="1" stop-color="#1c1c26"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="0.18" stop-color="#ff9e40"/>
      <stop offset="0.36" stop-color="#ffe14d"/>
      <stop offset="0.54" stop-color="#4dffa3"/>
      <stop offset="0.72" stop-color="#4dc9ff"/>
      <stop offset="0.88" stop-color="#7a6cff"/>
      <stop offset="1" stop-color="#d24dff"/>
    </linearGradient>
  </defs>
  <!-- incoming white beam -->
  <path d="M2 30 L26 30" stroke="#f5f5f5" stroke-width="3.2" stroke-linecap="round"/>
  <!-- prism -->
  <path d="M32 14 L48 44 L16 44 Z" fill="url(#glass)" stroke="#5a5a72" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- refraction highlight on the glass edge -->
  <path d="M32 14 L20 44" stroke="#8a8aa8" stroke-width="1" opacity="0.6"/>
  <!-- dispersed spectrum -->
  <g stroke="url(#spectrum)" stroke-width="3.2" stroke-linecap="round">
    <path d="M40 36 L62 22"/>
    <path d="M41 38 L62 30"/>
    <path d="M42 40 L62 38"/>
    <path d="M43 42 L62 46"/>
  </g>
</svg>
